<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日刻 · 数据中台</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/assets/icon.png" alt="日刻">
      <div>
        <div class="name">日刻</div>
        <div class="en">DAYTALLY</div>
        <div class="sub">数据中台 · Windows</div>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <button class="nav-btn" data-page="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        总览
      </button>
      <button class="nav-btn" data-page="bodyfat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c-2.8 3.6-5.2 7-5.2 10.2A5.2 5.2 0 0 0 12 18a5.2 5.2 0 0 0 5.2-4.8C17.2 10 14.8 6.6 12 3Z"/><path d="M12 8.2v7.2"/><path d="M9.4 12.8 12 15.4l2.6-2.6"/></svg>
        体脂率
      </button>
      <button class="nav-btn" data-page="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/></svg>
        今天
      </button>
      <button class="nav-btn" data-page="trend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 4-6"/></svg>
        趋势
      </button>
      <button class="nav-btn" data-page="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg>
        项目
      </button>
      <button class="nav-btn" data-page="fun">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
        趣事
      </button>
      <button class="nav-btn danger" data-page="data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5.5" rx="7" ry="2.6"/><path d="M5 5.5v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"/><path d="M5 11.5v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"/></svg>
        数据管理
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="conn-card">
        <div class="conn-row"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">未连接</span></div>
        <div class="conn-sub" id="conn-sub">点下面填写树莓派地址和 Token</div>
        <button class="btn btn-soft" id="open-settings">连接设置</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow">DAYTALLY / DESKTOP CONSOLE</div>
        <h1 id="page-title">今天，刻下多少</h1>
        <div class="page-sub" id="page-sub">在电脑上看见树莓派里的日刻数据</div>
      </div>
      <div class="top-actions">
        <button class="pill" id="conn-pill" type="button"><span class="dot"></span><span id="conn-pill-text">未连接</span></button>
        <button class="btn btn-ghost" id="refresh" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          刷新
        </button>
        <button class="btn btn-primary" id="settings-top" type="button">连接设置</button>
      </div>
    </header>

    <div id="content" aria-live="polite"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status"></div>

<script src="/app.js"></script>
</body>
</html>
